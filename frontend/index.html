<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmCraft 3D</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="hud">
      <div class="hud-title">FarmCraft 3D</div>
      <div class="hud-row">
        <span id="hud-health">Health: 100</span>
        <span id="hud-time">Time: Day</span>
      </div>
      <div id="hud-inventory" class="hud-inventory">wheat: 0 | seeds: 0 | eggs: 0 | wood: 0 | stone: 0</div>
      <div id="hud-status" class="hud-status">Click trees to collect wood. Survive the night.</div>
    </div>
    <div class="crosshair" aria-hidden="true"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
